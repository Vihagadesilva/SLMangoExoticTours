<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Metallic Specular Silver Gradients -->
    <linearGradient id="silverRimOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="14%" stop-color="#E2E6EA"/>
      <stop offset="32%" stop-color="#9BA2AB"/>
      <stop offset="50%" stop-color="#F1F4F7"/>
      <stop offset="68%" stop-color="#6C7580"/>
      <stop offset="84%" stop-color="#D1D6DC"/>
      <stop offset="100%" stop-color="#3D444E"/>
    </linearGradient>

    <linearGradient id="silverRimHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E5E9EE"/>
      <stop offset="65%" stop-color="#848E9B"/>
      <stop offset="100%" stop-color="#F4F6F9"/>
    </linearGradient>

    <linearGradient id="silverDeepShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D333B"/>
      <stop offset="50%" stop-color="#4C5460"/>
      <stop offset="100%" stop-color="#181D24"/>
    </linearGradient>

    <radialGradient id="silverFaceBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#EDF1F5"/>
      <stop offset="50%" stop-color="#CBD2DA"/>
      <stop offset="75%" stop-color="#98A1AD"/>
      <stop offset="92%" stop-color="#67717E"/>
      <stop offset="100%" stop-color="#474F5A"/>
    </radialGradient>

    <radialGradient id="silverMedallionField" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="30%" stop-color="#DFE4EA"/>
      <stop offset="62%" stop-color="#B2BCC7"/>
      <stop offset="85%" stop-color="#7B8795"/>
      <stop offset="100%" stop-color="#535E6D"/>
    </radialGradient>

    <linearGradient id="silverBeadGrad" x1="25%" y1="25%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#DFE4EA"/>
      <stop offset="80%" stop-color="#747F8D"/>
      <stop offset="100%" stop-color="#343C46"/>
    </linearGradient>

    <linearGradient id="chiseledSilverLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F4F6F9"/>
      <stop offset="60%" stop-color="#C5CCD6"/>
      <stop offset="100%" stop-color="#808C9C"/>
    </linearGradient>

    <linearGradient id="chiseledSilverDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55606E"/>
      <stop offset="50%" stop-color="#2D3540"/>
      <stop offset="100%" stop-color="#14181F"/>
    </linearGradient>

    <linearGradient id="silverSheenReflection" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="78%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.30"/>
    </linearGradient>

    <!-- Drop Shadows & Filters for Relief Depth -->
    <filter id="coinOuterDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#08141F" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#123B52" flood-opacity="0.25"/>
    </filter>

    <filter id="dropBead" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.6" flood-color="#1B222A" flood-opacity="0.6"/>
    </filter>

    <filter id="engravedRelief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="-1" stdDeviation="0.8" flood-color="#FFFFFF" flood-opacity="0.85"/>
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#141B22" flood-opacity="0.75"/>
    </filter>

    <filter id="letterEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#0E141B" flood-opacity="0.65"/>
      <feDropShadow dx="-1.5" dy="-1.5" stdDeviation="1.2" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>

    <!-- Circular Text Paths (Radius 146px) -->
    <path id="topTextArc" d="M 54,200 A 146,146 0 0,1 346,200" fill="none"/>
    <path id="bottomTextArc" d="M 346,200 A 146,146 0 0,1 54,200" fill="none"/>
  </defs>

  <g filter="url(#coinOuterDropShadow)">
    <!-- Base Outer Coin Edge -->
    <circle cx="200" cy="200" r="195" fill="url(#silverDeepShadow)"/>
    <circle cx="200" cy="200" r="193" fill="url(#silverRimOuter)"/>

    <!-- Milled Edge Notches (Serrated Coin Rim) -->
    <g stroke="url(#silverRimHighlight)" stroke-width="2" opacity="0.9">
      <!-- 36 milled marks around perimeter -->
      <line x1="200" y1="6" x2="200" y2="14"/>
      <line x1="233" y1="9" x2="231" y2="17"/>
      <line x1="266" y1="18" x2="263" y2="26"/>
      <line x1="297" y1="33" x2="292" y2="40"/>
      <line x1="324" y1="53" x2="318" y2="59"/>
      <line x1="347" y1="76" x2="340" y2="82"/>
      <line x1="365" y1="104" x2="357" y2="108"/>
      <line x1="378" y1="134" x2="369" y2="137"/>
      <line x1="384" y1="166" x2="375" y2="168"/>
      <line x1="385" y1="200" x2="376" y2="200"/>
      <line x1="384" y1="234" x2="375" y2="232"/>
      <line x1="378" y1="266" x2="369" y2="263"/>
      <line x1="365" y1="296" x2="357" y2="292"/>
      <line x1="347" y1="324" x2="340" y2="318"/>
      <line x1="324" y1="347" x2="318" y2="341"/>
      <line x1="297" y1="367" x2="292" y2="360"/>
      <line x1="266" y1="382" x2="263" y2="374"/>
      <line x1="233" y1="391" x2="231" y2="383"/>
      <line x1="200" y1="394" x2="200" y2="386"/>
      <line x1="167" y1="391" x2="169" y2="383"/>
      <line x1="134" y1="382" x2="137" y2="374"/>
      <line x1="103" y1="367" x2="108" y2="360"/>
      <line x1="76" y1="347" x2="82" y2="341"/>
      <line x1="53" y1="324" x2="60" y2="318"/>
      <line x1="35" y1="296" x2="43" y2="292"/>
      <line x1="22" y1="266" x2="31" y2="263"/>
      <line x1="16" y1="234" x2="25" y2="232"/>
      <line x1="15" y1="200" x2="24" y2="200"/>
      <line x1="16" y1="166" x2="25" y2="168"/>
      <line x1="22" y1="134" x2="31" y2="137"/>
      <line x1="35" y1="104" x2="43" y2="108"/>
      <line x1="53" y1="76" x2="60" y2="82"/>
      <line x1="76" y1="53" x2="82" y2="59"/>
      <line x1="103" y1="33" x2="108" y2="40"/>
      <line x1="134" y1="18" x2="137" y2="26"/>
      <line x1="167" y1="9" x2="169" y2="17"/>
    </g>

    <!-- Concentric Stepped Outer Chamfers -->
    <circle cx="200" cy="200" r="183" fill="none" stroke="url(#silverRimHighlight)" stroke-width="2.5"/>
    <circle cx="200" cy="200" r="180" fill="none" stroke="url(#silverDeepShadow)" stroke-width="1.8"/>
    <circle cx="200" cy="200" r="178" fill="url(#silverFaceBg)"/>

    <!-- Inscription Band Outer Bezel -->
    <circle cx="200" cy="200" r="168" fill="none" stroke="url(#silverDeepShadow)" stroke-width="1.4"/>
    <circle cx="200" cy="200" r="166" fill="none" stroke="url(#silverRimHighlight)" stroke-width="1.4"/>

    <!-- Beaded Ring (Pearl Numismatic Border) -->
    <g id="coinPearlBorder">
      <circle cx="200" cy="42" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="224" cy="44" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="248" cy="50" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="270" cy="60" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="291" cy="74" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="309" cy="91" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="325" cy="111" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="337" cy="134" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="345" cy="158" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="349" cy="183" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="348" cy="208" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="343" cy="233" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="333" cy="256" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="319" cy="278" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="301" cy="297" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="280" cy="313" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="256" cy="326" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="230" cy="334" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="204" cy="337" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="178" cy="335" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="152" cy="328" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="128" cy="317" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="106" cy="301" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="87" cy="282" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="73" cy="260" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="62" cy="237" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="56" cy="212" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="55" cy="187" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="59" cy="162" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="67" cy="138" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="79" cy="115" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="95" cy="95" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="114" cy="78" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="136" cy="64" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="160" cy="53" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
      <circle cx="184" cy="46" r="2.4" fill="url(#silverBeadGrad)" filter="url(#dropBead)"/>
    </g>

    <!-- Inscription Band Inner Border -->
    <circle cx="200" cy="200" r="147" fill="none" stroke="url(#silverDeepShadow)" stroke-width="1.2"/>
    <circle cx="200" cy="200" r="145" fill="none" stroke="url(#silverRimHighlight)" stroke-width="1.5"/>

    <!-- Minted Outer Inscription: Top Arc -->
    <text font-family="'Lexend', 'Ubuntu', serif" font-size="12" font-weight="700" letter-spacing="4.5" fill="#2A333E" filter="url(#engravedRelief)">
      <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
        SILVER ISLE EXPLORER
      </textPath>
    </text>

    <!-- Minted Outer Inscription: Bottom Arc -->
    <text font-family="'Lexend', 'Ubuntu', serif" font-size="10.5" font-weight="600" letter-spacing="3.8" fill="#2A333E" filter="url(#engravedRelief)">
      <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
        &#9733; 10-DAY SRI LANKA DISCOVERY &#9733;
      </textPath>
    </text>

    <!-- Inner Stepped Border into Medallion Core -->
    <circle cx="200" cy="200" r="132" fill="url(#silverDeepShadow)"/>
    <circle cx="200" cy="200" r="130" fill="url(#silverRimHighlight)"/>
    <circle cx="200" cy="200" r="128" fill="url(#silverMedallionField)"/>

    <!-- Frosted Matte Relief Field with Guilloche Accents -->
    <circle cx="200" cy="200" r="125" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>
    <circle cx="200" cy="200" r="121" fill="none" stroke="rgba(33,40,49,0.35)" stroke-width="1" stroke-dasharray="2,3"/>

    <!-- Subtle Engraved Tropical Leaves / Acanthus Scrolls (Left & Right Flanks) -->
    <g stroke="url(#chiseledSilverLight)" stroke-width="1.3" fill="none" opacity="0.45" filter="url(#engravedRelief)">
      <!-- Left Tropical Palm Frond -->
      <path d="M 102,175 C 98,188 98,205 104,218 C 107,224 113,230 119,233"/>
      <path d="M 100,182 C 105,183 111,180 113,176"/>
      <path d="M 98,195 C 104,196 110,192 112,187"/>
      <path d="M 99,207 C 105,208 110,203 113,198"/>
      <path d="M 103,219 C 108,218 113,212 115,207"/>

      <!-- Right Tropical Palm Frond -->
      <path d="M 298,175 C 302,188 302,205 296,218 C 293,224 287,230 281,233"/>
      <path d="M 300,182 C 295,183 289,180 287,176"/>
      <path d="M 302,195 C 296,196 290,192 288,187"/>
      <path d="M 301,207 C 295,208 290,203 287,198"/>
      <path d="M 297,219 C 292,218 287,212 285,207"/>
    </g>

    <!-- Subtle Engraved Contour Silhouette of the Island of Sri Lanka -->
    <g opacity="0.28" filter="url(#engravedRelief)">
      <path d="M 200,136 C 206,141 210,150 214,162 C 218,175 224,190 225,205 C 226,219 223,234 218,247 C 213,258 205,268 197,272 C 189,270 183,261 179,249 C 175,237 173,223 174,209 C 175,196 178,182 182,169 C 187,157 193,145 200,136 Z" 
            fill="url(#chiseledSilverLight)" stroke="#2D3540" stroke-width="0.8"/>
    </g>

    <!-- Subtle Royal Sinhalese Heraldic Lion Engraving in the Field -->
    <g opacity="0.22" filter="url(#engravedRelief)">
      <path d="M 188,162 C 193,158 198,158 203,161 C 206,163 209,161 213,164 C 217,167 217,172 214,175 C 217,177 219,181 217,185 C 214,190 209,192 204,191 C 199,195 192,195 188,191 C 183,188 181,182 183,176 C 180,172 181,166 185,163 Z" fill="url(#chiseledSilverDark)"/>
      <line x1="216" y1="152" x2="224" y2="175" stroke="#FFFFFF" stroke-width="1.8"/>
    </g>

    <!-- Central Masterpiece: Sophisticated, Chiseled Letter "S" -->
    <g filter="url(#letterEmboss)">
      <!-- Master Chiseled Letter S (Classic Roman Numismatic Serif Form) -->
      <!-- Left / Top Specular Highlight Facet -->
      <path d="
        M 226,145 
        C 219,139 209,135 198,135 
        C 181,135 168,145 168,160 
        C 168,173 177,181 193,186 
        L 207,191 
        C 223,196 233,206 233,222 
        C 233,239 217,251 197,251 
        C 182,251 170,244 162,235 
        L 169,224 
        C 176,233 186,239 197,239 
        C 210,239 220,232 220,222 
        C 220,211 211,202 196,197 
        L 182,192 
        C 167,187 156,177 156,160 
        C 156,143 172,125 198,125 
        C 212,125 224,130 233,139 
        Z
      " fill="url(#chiseledSilverLight)"/>

      <!-- Right / Bottom Shadow Relief Facet -->
      <path d="
        M 233,139 
        L 226,145 
        C 219,139 209,135 198,135 
        L 198,125 
        C 212,125 224,130 233,139 
        Z
        M 168,160 
        C 168,173 177,181 193,186 
        L 190,192 
        C 174,186 164,177 164,160 
        Z
        M 207,191 
        C 223,196 233,206 233,222 
        C 233,239 217,251 197,251 
        L 197,239 
        C 210,239 220,232 220,222 
        C 220,211 211,202 196,197 
        Z
      " fill="url(#chiseledSilverDark)" opacity="0.8"/>

      <!-- Sharp Central Bevel Ridge Highlight on the S -->
      <path d="
        M 198,130 
        C 178,130 163,144 163,160 
        C 163,174 173,183 188,188 
        L 202,193 
        C 218,198 227,208 227,222 
        C 227,235 214,245 197,245 
        C 184,245 173,239 166,230
      " fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
    </g>

    <!-- Subtitle Plaque in Medallion: SILVER COLLECTION -->
    <g filter="url(#engravedRelief)">
      <rect x="132" y="261" width="136" height="17" rx="3.5" fill="url(#silverFaceBg)" stroke="url(#silverRimHighlight)" stroke-width="0.8"/>
      <text x="200" y="273.5" font-family="'Lexend', 'Ubuntu', sans-serif" font-size="8" font-weight="700" letter-spacing="2.2" fill="#242B35" text-anchor="middle">
        SILVER COLLECTION
      </text>
    </g>

    <!-- Numismatic Hallmark: 999 FINE SILVER -->
    <text x="200" y="291" font-family="'Ubuntu', sans-serif" font-size="6.8" font-weight="600" letter-spacing="2.2" fill="#505B6A" text-anchor="middle" filter="url(#engravedRelief)">
      999 FINE SILVER &bull; CEYLON
    </text>

    <!-- Dynamic Specular Luster / Light Glint Overlay (Anisotropic Coin Sheen) -->
    <circle cx="200" cy="200" r="192" fill="url(#silverSheenReflection)" pointer-events="none"/>
    <ellipse cx="140" cy="110" rx="90" ry="32" transform="rotate(-35 140 110)" fill="#FFFFFF" opacity="0.22" pointer-events="none"/>
  </g>
</svg>
